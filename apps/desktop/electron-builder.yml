appId: ai.deepseek.dsh.desktop
productName: DeepSeek Harness
directories:
  output: release
compression: maximum
files:
  - lib/main/index.cjs
  - assets/loading.html
  - assets/loading.css
  - assets/loading.js
  - build/icon.png
  - build/tray-light.png
  - build/tray-dark.png
  - upstream.json
  - package.json
  - '!node_modules/**'
asar: true
npmRebuild: false
afterPack: scripts/copy-backend-after-pack.cjs
extraResources:
  - from: build/node
    to: node
win:
  icon: build/icon.ico
  target:
    - nsis
publish:
  provider: github
  owner: ${env.DSH_DESKTOP_UPDATE_OWNER}
  repo: ${env.DSH_DESKTOP_UPDATE_REPO}
  tagNamePrefix: desktop-v
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
